version: "2"

run:
  # Mount-level tests are linted too, even though only the mount CI job runs them.
  build-tags: [mounttest]

linters:
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - nilerr
    - rowserrcheck
    - unconvert
    - wastedassign
    - revive
  settings:
    revive:
      rules:
        - name: unused-parameter
  exclusions:
    presets:
      # Close and os.Remove on cleanup paths, with nothing to report the error to.
      - std-error-handling
