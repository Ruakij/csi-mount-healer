name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A CVE published after a merge is still our problem, so rescan daily.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A push supersedes the run of the commit before it, so drop that one instead of
# waiting for a verdict on code nobody has any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: gofmt -l cmd internal | tee /dev/stderr | (! read)
      - run: go mod tidy -diff
      - run: go vet ./...
      - name: go vet (mount tests)
        run: go vet -tags mounttest ./...
      - run: go test -race ./...
      - run: make build
      # Read from a plain file so it can be bumped without a token carrying the
      # workflow scope.
      - id: lint-version
        run: echo "version=$(cat hack/golangci-lint.version)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lint-version.outputs.version }}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint charts/csi-mount-healer
      - run: helm template ci charts/csi-mount-healer --set config.interval=2m --set config.selector='driver in (a\,b)' > /dev/null
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      # The released chart version comes from the git tag, not Chart.yaml, so
      # demanding a version bump per chart change would be asking for a no-op edit.
      - run: ct lint --target-branch ${{ github.event.repository.default_branch }} --chart-dirs charts --check-version-increment=false

  # Real mounts, guards and a remount through a fake CSI driver. The runner is a
  # VM with its own kernel, so a privileged container is enough.
  mount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test-mount

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reachability-aware, so it only fails on vulnerabilities we actually call.
      # It installs its own Go, hence no setup-go step; go-version-input must be
      # cleared or it collides with go-version-file.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-file: go.mod
          go-version-input: ""
      # Misconfig scanning is off: the healer is privileged and hostPath-mounted
      # by design, and every hit would be a waiver.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: csi-mount-healer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: csi-mount-healer:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
