apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-mount-healer
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csi-mount-healer
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  # What kubelet reads to rebuild the NodeStageVolume and NodePublishVolume calls,
  # secrets included when a volume references node stage or publish secrets.
  - apiGroups: [""]
    resources: [persistentvolumes, secrets]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [csidrivers, volumeattachments]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: csi-mount-healer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: csi-mount-healer
subjects:
  - kind: ServiceAccount
    name: csi-mount-healer
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-mount-healer
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: csi-mount-healer
  template:
    metadata:
      labels:
        app: csi-mount-healer
    spec:
      serviceAccountName: csi-mount-healer
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: healer
          image: ghcr.io/ruakij/csi-mount-healer:0.1.0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CRI_ENDPOINT
              value: unix:///run/containerd/containerd.sock
          securityContext:
            # Bidirectional propagation requires privileged, which grants every
            # capability and ignores capabilities.drop; the binary drops all but
            # CAP_SYS_ADMIN, CAP_LINUX_IMMUTABLE and CAP_DAC_READ_SEARCH itself at
            # startup.
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            # Same path as on the node: kubelet and the drivers speak in host paths.
            - name: kubelet
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: cri
              mountPath: /run/containerd/containerd.sock
      volumes:
        - name: kubelet
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        # k3s: /run/k3s/containerd/containerd.sock
        - name: cri
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
