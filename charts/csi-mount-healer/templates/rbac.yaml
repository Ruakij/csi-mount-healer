apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "csi-mount-healer.fullname" . }}
  labels:
    {{- include "csi-mount-healer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  # What kubelet reads to rebuild the NodeStageVolume and NodePublishVolume calls,
  # secrets included when a volume references node stage or publish secrets.
  - apiGroups: [""]
    resources: [persistentvolumes, secrets]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [csidrivers, volumeattachments]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "csi-mount-healer.fullname" . }}
  labels:
    {{- include "csi-mount-healer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "csi-mount-healer.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "csi-mount-healer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
