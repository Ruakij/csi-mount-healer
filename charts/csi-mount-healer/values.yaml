image:
  repository: ghcr.io/ruakij/csi-mount-healer
  tag: "" # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# Flags of the healer by name, without the leading dash; anything not set keeps
# the default of the binary. See the configuration table in the README, e.g.:
#   interval: 1m
#   strikes: 3
#   tiers: live,restart,delete
#   live-timeout: 1m
#   remount-attempts: 3
#   driver-down-attempts: 0
#   force-delete: true
#   guard: always
#   guard-stage: false
#   check-containers: true
#   metrics-addr: ":9102"
#   selector: "driver in (csi.moosefs.com),!csi-mount-healer/skip"
#   v: 2
config: {}

# The kubelet directory on the node, mounted at the same path in the container:
# kubelet and the drivers speak in host paths. k3s and RKE2 use the default.
kubeletRootDir: /var/lib/kubelet

# Container runtime socket on the node, for the restart and live tiers and
# check-containers.
# k3s: /run/k3s/containerd/containerd.sock
# RKE2: /run/k3s/containerd/containerd.sock
criSocket: /run/containerd/containerd.sock

serviceAccount:
  create: true
  name: ""

# Not hardened like a plain workload, each deviation has a reason:
# - runAsNonRoot is unset: the healer unmounts and remounts under the kubelet
#   directory and sets the immutable attribute, which needs root.
# - privileged is true: Bidirectional mount propagation requires it. It grants
#   every capability and ignores capabilities.drop, and the API server rejects
#   allowPrivilegeEscalation: false together with it, so neither is set. The
#   binary drops all but CAP_SYS_ADMIN, CAP_LINUX_IMMUTABLE,
#   CAP_DAC_READ_SEARCH, CAP_SYS_PTRACE and CAP_SYS_CHROOT itself at startup.
# - The service account token stays mounted: the healer lists pods and creates
#   events through the Kubernetes API.
# The root filesystem is read-only; the healer writes nothing to it.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  privileged: true
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Mounts die on every node a CSI driver runs on, so the healer runs on all of
# them, tainted ones included.
tolerations:
  - operator: Exists
nodeSelector: {}
affinity: {}
priorityClassName: system-node-critical
updateStrategy:
  type: RollingUpdate
podLabels: {}
podAnnotations: {}
